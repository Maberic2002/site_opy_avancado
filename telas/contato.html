<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opylendas - Contato</title>
  <link rel="stylesheet" href="../style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header-site">
    <a href="../index.html"><img src="../assets/Logos/Logo opylendas Claro Novo.png" alt="Opylendas" class="logo-img"></a>
    <nav class="nav-links-center">
      <a href="../index.html">Início</a>
      <a href="santuario.html">Santuário</a>
      <a href="diario.html">OpyDiário</a>
      <a href="loja.html">Loja</a>
    </nav>
    <a href="sobre.html" class="sobre-nos-link">
      <img src="../assets/Logos/Grafismo Flor Livro Aberto.png" alt="Sobre nós" class="sobre-nos-img">
      <span>Sobre nós</span>
    </a>
  </header>

  <main class="main-container">
    <div class="breadcrumb"><a href="../index.html">Início</a> > Fale Conosco</div>
    <h1 class="page-title">Fale Conosco</h1>
    
    <div class="contact-layout">
      <div class="contact-chibi">
        <img src="../assets/Chibis/faleconosco.png" alt="Personagem OpyLendas para falar conosco">
      </div>
      <div class="contact-form-box">
      <form onsubmit="event.preventDefault(); alert('Mensagem enviada com sucesso!');">
        <div style="margin-bottom: 1rem;">
          <label style="display:block; margin-bottom: 0.5rem; font-weight: 600;">Nome:</label>
          <input type="text" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display:block; margin-bottom: 0.5rem; font-weight: 600;">E-mail:</label>
          <input type="email" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px;">
        </div>
        <div style="margin-bottom: 1rem;">
          <label style="display:block; margin-bottom: 0.5rem; font-weight: 600;">Mensagem:</label>
          <textarea rows="4" required style="width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 6px;"></textarea>
        </div>
        <button type="submit" class="btn-yellow" style="border:none; cursor:pointer;">Enviar Mensagem</button>
      </form>
      </div>
    </div>
  </main>

  <footer class="footer-site">
    <div class="footer-content">
      <div class="footer-links">
        <a href="sobre.html">Sobre nós</a>
        <a href="contato.html">Fale conosco</a>
        <a href="trocas-devolucoes.html">Trocas e devoluções</a>
        <a href="rastrear-pedidos.html">Rastrear pedidos</a>
        <a href="guia-medidas.html">Guia de medidas</a>
        <a href="carrinho.html">Carrinho</a>
      </div>
      <div class="footer-bottom">
        <span>© Opylendas. Todos os direitos reservados.</span>
      </div>
    </div>
  </footer>

  <script src="../script.js"></script>
</body>
</html>
